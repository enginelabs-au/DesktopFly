[project]
name = "local-fly-sim"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "pyarrow>=18,<30",
  "pandas>=2.2,<4",
  "torch>=2.5,<3",
  "websockets>=14,<18",
  "pydantic>=2.10,<3",
  "safetensors>=0.5,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flysim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
